<!-- Carbon Signal (docs/design/mockup/decks/3-carbon-signal.html): the chamfered slab's sheen and edge (its carbon-fibre weave is drawn under it, in Styles/Decks.axaml), the hex arm board, the rest and the readout window. Deck units. The edge light, the readout, the name and the platter ticks are drawn on top. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1080">
  <defs>
    <linearGradient id="sheen0" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1320" y2="1080"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
    <linearGradient id="gun1" gradientUnits="userSpaceOnUse" x1="1080" y1="113.4" x2="1280" y2="286.6"><stop offset="0" stop-color="#3a3d44"/><stop offset="1" stop-color="#16171a"/></linearGradient>
  </defs>
  <polygon points="60,0 1260,0 1320,60 1320,1020 1260,1080 60,1080 0,1020 0,60" fill="url(#sheen0)" stroke="#3a3d44" stroke-width="2"/>
  <!-- hex arm board -->
  <polygon points="1280,200 1230,286.6 1130,286.6 1080,200 1130,113.4 1230,113.4" fill="url(#gun1)" stroke="#45484f" stroke-width="2"/>
  <!-- arm rest -->
  <path d="M1183,636 h16 l6,12 h-4 M1223,636 h-16 l-6,12" fill="none" stroke="#5a5e66" stroke-width="5" stroke-linejoin="round"/>
  <!-- the speed readout's window -->
  <rect x="52" y="52" width="150" height="62" rx="4" fill="#060607" stroke="#2a2c31" stroke-width="2"/>
</svg>
