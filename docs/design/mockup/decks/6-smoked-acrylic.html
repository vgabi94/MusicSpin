<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deck 6 — Smoked Acrylic</title>
  <link rel="stylesheet" href="kit.css">
  <style>
    /* ---------- Deck: smoked acrylic slab (the room glow shows through), clear platter, edge light ---------- */
    .acrylic {
      border-radius: calc(var(--u) * 26);
      background: linear-gradient(155deg, #ffffff1f, #ffffff08 35%, transparent 60%, #0000002e), #1a1c22a8;
      -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
      box-shadow: inset 0 0 0 1px #ffffff2e, inset 0 0 0 calc(var(--u) * 12) #ffffff07, inset 0 1px 0 #ffffff4d, 0 30px 60px -20px #000c;
    }
    :root.light .acrylic { background: linear-gradient(155deg, #ffffff40, #ffffff10 35%, transparent 60%, #0000001a), #2a2d35b8; }
    .acrylic::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: -1px; height: 2px; border-radius: 2px;
      background: var(--accent); box-shadow: 0 0 calc(var(--u) * 30) calc(var(--u) * 4) var(--accent); opacity: .15;
      transition: opacity calc(.8s * var(--m)), background 1s, box-shadow 1s; }
    .acrylic.spinning::after { opacity: .9; }
    .acrylic .platter {
      background: radial-gradient(circle, #ffffff0d 0 94%, #ffffff40 95.5%, #ffffff14 97%, #ffffff33 99.4%);
      box-shadow: 0 0 0 1px #ffffff3d, 0 calc(var(--u) * 10) calc(var(--u) * 24) #0006;
    }
    .acrylic .platter::after { content: ""; position: absolute; left: 50%; top: 50%; width: 2%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #9aa0a8); }
    .acrylic .engrave { font: 600 26px "Inter", "Segoe UI Variable", "Segoe UI", sans-serif; letter-spacing: 12px; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="stage">
    <div class="deck acrylic" style="--py: 200; --rest: 0deg; --play: 25deg">
      <svg class="plate" viewBox="0 0 1320 1080">
        <!-- clear arm board and rest -->
        <circle cx="1180" cy="200" r="92" fill="#ffffff0d" stroke="#ffffff38" stroke-width="2"/>
        <circle cx="1180" cy="200" r="80" fill="none" stroke="#ffffff14" stroke-width="2"/>
        <rect x="1186" y="636" width="34" height="24" rx="12" fill="#ffffff1f" stroke="#ffffff4d" stroke-width="2"/>
        <!-- frosted etching -->
        <text class="engrave" x="46" y="1018" fill="#ffffff38">MUSIC SPIN</text>
      </svg>
      <div class="platter"></div>
      <div class="vinyl"></div>
      <!-- needle: slim matte-white tube and headshell, clear acrylic counterweight -->
      <div class="arm">
        <svg viewBox="-300 -300 600 1200">
          <defs>
            <linearGradient id="whiteCyl" x1="0" x2="1"><stop offset="0" stop-color="#b9bcc2"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#c4c7cc"/></linearGradient>
          </defs>
          <rect x="-40" y="-168" width="80" height="78" rx="18" fill="#ffffff26" stroke="#ffffff80" stroke-width="2"/>
          <rect x="-12" y="-150" width="24" height="42" rx="4" fill="url(#whiteCyl)"/>
          <rect x="-5" y="-92" width="10" height="94" fill="url(#whiteCyl)"/>
          <path d="M0,0 L34,657" stroke="#e9ebee" stroke-width="11" stroke-linecap="round"/>
          <path d="M-2,10 L32,650" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <circle r="40" fill="url(#whiteCyl)"/>
          <circle r="14" fill="#d5d8dc" stroke="#ffffffaa" stroke-width="2"/>
          <g transform="rotate(22 0 740)">
            <rect x="-22" y="648" width="44" height="110" rx="14" fill="url(#whiteCyl)"/>
            <rect x="-15" y="684" width="30" height="62" rx="6" fill="#1b1d22"/>
            <path d="M22,668 C52,664 70,652 80,632" fill="none" stroke="#e9ebee" stroke-width="6" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="caption">
      <h1>6 · Smoked Acrylic</h1>
      <p>Modern and a little techy. Smoked acrylic you can see the album glow through, a clear platter, and an edge light in the album colour while it spins. The needle is a slim matte-white arm with a clear counterweight. The name is frosted into the acrylic.</p>
    </div>
    <div class="controls"><button id="play"></button><button id="next">Next record</button><button id="light">Light / dark</button></div>
  </div>
  <script src="../data.js"></script>
  <script src="kit.js"></script>
</body>
</html>
