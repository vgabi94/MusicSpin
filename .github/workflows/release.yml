name: Release builds

# Builds portable, self-contained single-file packages per RID and uploads them as workflow artifacts.
# On a v* tag it also creates a draft GitHub release with the packages attached. It never creates tags and
# never publishes a release; publishing stays a manual decision.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The version comes from Directory.Build.props; a v* tag must match it (tag v0.2.0 = <Version>0.2.0</Version>).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version, check the tag
        id: read
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          [[ -n "$version" ]] || { echo "::error::No <Version> in Directory.Build.props"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, smoke: true }
          - { rid: win-arm64,   os: windows-latest, smoke: false }
          - { rid: linux-x64,   os: ubuntu-latest,  smoke: true }
          - { rid: linux-arm64, os: ubuntu-latest,  smoke: false }
          # macOS packages must be built on macOS so the executables and the .app get (ad-hoc) code signed.
          - { rid: osx-x64,     os: macos-latest,   smoke: false }
          - { rid: osx-arm64,   os: macos-latest,   smoke: true }

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the arm64 cross compiler (native/msaudio)
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/publish.ps1 -Rid ${{ matrix.rid }} -DownloadFFmpeg

      - name: Publish (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./eng/publish.sh ${{ matrix.rid }} --download-ffmpeg

      - name: Smoke test from a temporary folder
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R "artifacts/publish/${{ matrix.rid }}/." "$tmp/"
          exe="$tmp/music-spin"; [[ -f "$exe.exe" ]] && exe="$exe.exe"
          # Desktop app next to the CLI: MusicSpin / MusicSpin.exe, or the MusicSpin.app bundle on macOS.
          test -f "$tmp/MusicSpin" || test -f "$tmp/MusicSpin.exe" || test -f "$tmp/MusicSpin.app/Contents/MacOS/MusicSpin"
          mkdir "$tmp/music" && cp tests/MusicSpin.Tests/Fixtures/* "$tmp/music/"
          "$exe" doctor --backend null --json || [[ $? -eq 6 ]]   # 6 = no FFmpeg for this RID (macOS without Homebrew)
          "$exe" library add "$tmp/music" --json
          "$exe" library scan --quiet --json
          "$exe" library stats --json
          test -f "$tmp/.usrdata/settings.json"
          test -f "$tmp/.usrdata/library.db"

      - name: Archive (keeps executable bits and the .app bundle intact)
        shell: bash
        run: |
          cd artifacts/publish
          tar -czf "musicspin-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz" -C "${{ matrix.rid }}" .

      # archive: false uploads the .tar.gz as-is (no zip-in-zip); the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/publish/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  # A v* tag ends in a draft GitHub release with the six packages attached. It only runs when every package job
  # succeeded, and it never publishes: Gabriel reviews the draft and publishes it by hand.
  draft-release:
    needs: [version, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: musicspin-*.tar.gz
          path: dist
          merge-multiple: true

      - name: Check the packages
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          # One per RID in the package matrix above; keep the two in step.
          expected=6
          count="$(find dist -maxdepth 1 -name "musicspin-$VERSION-*.tar.gz" | wc -l)"
          if [[ "$count" -ne "$expected" ]]; then
            echo "::error::Expected $expected musicspin-$VERSION-*.tar.gz packages, found $count"
            exit 1
          fi

      - name: Create or update the draft release
        shell: bash
        run: |
          set -euo pipefail
          # A re-run of the workflow for the same tag replaces the files of the existing draft.
          # A release that is already published is left alone.
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != true ]]; then
              echo "::error::Release $TAG is already published; not touching it"
              exit 1
            fi
            gh release upload "$TAG" dist/*.tar.gz --clobber
            echo "Updated the draft release $TAG"
          else
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)   # 0.2.0-beta.1 and similar
            gh release create "$TAG" dist/*.tar.gz --draft --verify-tag --generate-notes \
              --title "MusicSpin $VERSION" "${prerelease[@]}"
            echo "Created the draft release $TAG"
          fi
