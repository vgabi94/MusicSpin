name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run still in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A failed download doesn't stop the tests (the FFmpeg-backed ones skip themselves, the rest still report),
      # but the job fails at the doctor check below.
      - name: Install FFmpeg 9.0 shared libraries (Linux/macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: ./eng/get-ffmpeg.sh

      - name: Install FFmpeg 9.0 shared libraries (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./eng/get-ffmpeg.ps1

      - name: Restore
        run: dotnet restore MusicSpin.slnx

      - name: Build
        run: dotnet build MusicSpin.slnx --configuration Release --no-restore

      # Core and CLI tests run with code coverage of MusicSpin.Core and music-spin.dll (eng/CodeCoverage.xml), measured
      # on each OS's own runner so Windows-only and macOS-only code counts. Every project runs even if one fails.
      - name: Test
        shell: bash
        run: |
          cov=(--coverage --coverage-output-format cobertura --coverage-settings "$PWD/eng/CodeCoverage.xml" --results-directory "$PWD/coverage")
          failed=0
          dotnet test --project tests/MusicSpin.Tests --configuration Release --no-build "${cov[@]}" --coverage-output core.cobertura.xml || failed=1
          dotnet test --project tests/MusicSpin.Tests.Cli --configuration Release --no-build "${cov[@]}" --coverage-output cli.cobertura.xml || failed=1
          dotnet test --project tests/MusicSpin.Tests.Ui --configuration Release --no-build || failed=1
          exit $failed

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/*.cobertura.xml
          if-no-files-found: warn

      # UI snapshot mismatches: the actual image and a diff per failed snapshot (tests/MusicSpin.Tests.Ui, Harness/Snapshots.cs).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-snapshot-failures-${{ matrix.os }}
          path: tests/MusicSpin.Tests.Ui/bin/Release/*/SnapshotFailures/
          if-no-files-found: ignore

      # Exit 6 = FFmpeg missing: the FFmpeg-backed tests above were skipped, so the job fails here.
      - name: CLI smoke test (FFmpeg found)
        shell: bash
        run: |
          dotnet run --project src/MusicSpin.Cli --configuration Release --no-build -- --help > /dev/null
          dotnet run --project src/MusicSpin.Cli --configuration Release --no-build -- doctor --backend null --json

  # native/msaudio (miniaudio + flat C API) for every RID the release ships. build-test builds its own OS's RID
  # through MSBuild (eng/Native.targets); this job proves the cross-architecture builds too.
  native:
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Install the arm64 cross compiler
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/build-native.ps1 -Rid ${{ matrix.rid }}

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./eng/build-native.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: msaudio-${{ matrix.rid }}
          path: native/msaudio/bin/${{ matrix.rid }}/*msaudio.*

  # The check the "Protect main" ruleset requires (named CI): green only when the build and tests passed on every OS
  # and the native layer built for every RID.
  ci:
    name: CI
    needs: [build-test, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every OS passed
        run: '[[ "${{ needs.build-test.result }}" == success && "${{ needs.native.result }}" == success ]]'

  # Merges the per-OS Cobertura files into the run's summary page. Informational: never fails the run.
  coverage-summary:
    name: coverage summary
    needs: build-test
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Merge and summarize
        shell: bash
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          {
            echo "## Coverage: MusicSpin.Core and the CLI (music-spin)"
            for os in ubuntu-latest windows-latest macos-latest; do
              [ -d "coverage/coverage-$os" ] || continue
              reportgenerator -reports:"coverage/coverage-$os/*.cobertura.xml" -targetdir:"report/$os" -reporttypes:"MarkdownAssembliesSummary" >/dev/null
              echo "### $os (Core + CLI tests)"
              grep -v "^!\[" "report/$os/Summary.md" | sed "s/^# Summary//"
            done
            reportgenerator -reports:"coverage/**/*.cobertura.xml" -targetdir:report/merged -reporttypes:"MarkdownAssembliesSummary;Html" >/dev/null
            echo "### All OSes merged"
            grep -v "^!\[" report/merged/Summary.md | sed "s/^# Summary//"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: report/merged
